<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOSS 画像生成</title>
<link rel="stylesheet" href="/studio/style.css"><script src="/studio/image.js" defer></script></head>
<body><header><a class="brand" href="/studio/image">MOSS<span>画像生成</span></a><a class="quiet" href="/studio/">漫画スタジオ ↗</a></header>
<div id="notice" role="status" hidden></div>
<main><div class="workspace"><section class="editor"><div class="tab-content">
<h1>画像を生成</h1><p class="hint">1152 × 1536 · 25ステップ。生成はPodで続くので、Safariを離れても大丈夫です。</p>
<label>キャラクター<select id="character"></select></label>
<label>場面・ポーズ・衣装・演出<textarea id="prompt" rows="10"></textarea></label>
<p class="hint">キャラのトリガーと基本の外見は自動で追加します。</p>
<button id="preset" class="secondary" type="button">元の衣装のプロンプトを入れる</button>
<details><summary>生成設定</summary>
<div class="two"><label>幅<input id="width" type="number" value="1152" min="256" max="4096" step="16"></label><label>高さ<input id="height" type="number" value="1536" min="256" max="4096" step="16"></label></div>
<label>ステップ数<select id="sampling"><option value="comfy">25 · er_sde / CFG 2.5</option><option value="quality">50 · Euler / CFG 3</option></select></label>
<div class="two"><label>LoRA強度<input id="strength" type="number" min="0" max="2" step="0.05" value="1"></label><label>シード<input id="seed" type="number" min="0" step="1" value="42"></label></div>
<button id="random" class="secondary" type="button">シードを変更</button></details>
<button id="generate" class="primary" type="button" disabled>画像を生成</button>
</div></section><section><h2>生成履歴</h2><div id="results"><p class="empty">ここに完成画像が並びます。</p></div></section></div></main>
<footer>完成画像はPNGで保存できます。設定とプロンプトも履歴に残ります。</footer></body></html>
